services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env — inside compose, Mongo is reached by service
      # name, not localhost.
      MONGODB_URL: mongodb://mongo:27017
    volumes:
      - backend_uploads:/app/uploads
      - backend_vector_store:/app/vector_store
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  backend_uploads:
  backend_vector_store:
